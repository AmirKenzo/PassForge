name: Feature Request
description: Suggest a new feature for PassForge
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Considerations
      options:
        - label: This feature can be implemented fully client-side
          required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical

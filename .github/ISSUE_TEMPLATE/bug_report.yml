name: Bug Report
description: Report a bug in PassForge
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! PassForge is privacy-first — please don't include real passwords or secrets.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / Platform
      placeholder: e.g. Chrome 120, Windows 11, PWA
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Affected Tool
      options:
        - Password Generator
        - Password Analyzer
        - Passphrase Generator
        - Username Generator
        - UUID Generator
        - API Key Generator
        - Token Generator
        - Random String Generator
        - Hash Generator
        - Security Utilities
        - Dashboard / UI
        - Other
